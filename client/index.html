
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#4CAF50" />
    <meta name="description" content="Plan your weekly meals, generate shopping lists, and manage your pantry efficiently" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS specific meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MealPlan" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    
    <!-- Android/Chrome specific -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="MealPlan" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    
    <!-- Prevent zoom on form inputs on iOS -->
    <meta name="format-detection" content="telephone=no" />
    
    <title>Weekly Meal Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>    
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript">
      if (location.hostname.includes("repl.co") || location.hostname.includes("localhost")) {
        const script = document.createElement("script");
        script.src = "https://replit.com/public/js/replit-dev-banner.js";
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
