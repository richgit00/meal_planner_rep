services:
  - type: web
    name: mealplanner-pro
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: NODE_ENV=production RENDER=true node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: mealplanner-db
          property: connectionString

databases:
  - name: mealplanner-db
    databaseName: mealplanner
    user: mealplanner_user
    plan: free